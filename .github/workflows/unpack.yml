name: Unpack
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 0; fi
          unzip -oq "$ZIP"
          rm "$ZIP"
          rm -rf jarvis-assistant/.github
          cp -a jarvis-assistant/. .
          rm -rf jarvis-assistant
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Update Jarvis"
          git push
          gh workflow run build.yml
