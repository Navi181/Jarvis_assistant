
name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
          echo "Found zip: $ZIP"
          if [ -z "$ZIP" ]; then echo "NO ZIP FOUND. Files in repo:"; ls -la; exit 1; fi
          unzip -q "$ZIP"
          rm "$ZIP"
          rm -rf jarvis-assistant/.github
          cp -a jarvis-assistant/. .
          rm -rf jarvis-assistant
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Jarvis project"
          git push
